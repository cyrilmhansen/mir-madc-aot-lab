function render(){const e=E[pos], [src,rev,structure]=currentAt(pos), [st,cl]=badge(e.event);$('counter').textContent=`${pos+1} / ${E.length}`; $('eventTitle').textContent=({"session_started": "Session started", "checkpoint_created": "Checkpoint", "operation_proposed": "Proposed operation", "symbol_discovered": "Semantic target discovered", "preview_accepted": "Preview accepted (not committed)", "preview_rejected": "Preview rejected", "transaction_committed": "Transaction committed", "transaction_rejected": "Operation denied; state unchanged", "program_validated": "Program validated", "program_executed": "MIR execution", "replay_started": "Replay started in fresh workspace", "replay_completed": "Replay equivalence result", "replay_failed": "Replay failed", "session_completed": "Session completed"}[e.event]||e.event);$('eventStatus').innerHTML=`<span class="badge ${cl}">${st}</span>`;$('eventMeta').textContent=`#${e.sequence} · ${e.phase||''} · rev ${e.base_revision??e.revision??'—'} → ${e.resulting_revision??'—'} · ${e.timestamp_utc||''}`;
let details={};for(const [k,v] of Object.entries(e))if(!['sequence','event','timestamp_utc','program_snapshot','preview_diff'].includes(k))details[k]=v;
if(e.event==='transaction_rejected')$('eventDetails').innerHTML=`<div class="denial"><strong>Denied: ${esc(e.code)}</strong><br>${esc(e.message)}<br>Authoritative state unchanged: ${String(e.authoritative_state_unchanged)}</div>`;else $('eventDetails').innerHTML='';
$('eventDetails').append(Object.assign(document.createElement('pre'),{textContent:JSON.stringify(details,null,2)}));$('currentProgram').textContent=src||'(empty virtual document)';$('currentRevision').textContent=`Committed revision ${rev}`;$('currentStructure').textContent=JSON.stringify(structure,null,2);$('previewDiff').textContent=e.preview_diff||'(no preview for this event)';
document.querySelectorAll('.event').forEach((b,n)=>b.classList.toggle('active',n===pos));}
function init(){$('subtitle').textContent=`${DATA.profile.name} · Mission: ${DATA.mission.objective} · scripted trace, not an LLM session`;$('mission').textContent=JSON.stringify(DATA.mission,null,2);$('profile').textContent=JSON.stringify(DATA.profile,null,2);$('events').innerHTML=E.map((e,i)=>`<button class="event" data-i="${i}"><span class="badge ${badge(e.event)[1]}">${badge(e.event)[0]}</span> &nbsp;${i+1}. ${safe(({"session_started": "Session started", "checkpoint_created": "Checkpoint", "operation_proposed": "Proposed operation", "symbol_discovered": "Semantic target discovered", "preview_accepted": "Preview accepted (not committed)", "preview_rejected": "Preview rejected", "transaction_committed": "Transaction committed", "transaction_rejected": "Operation denied; state unchanged", "program_validated": "Program validated", "program_executed": "MIR execution", "replay_started": "Replay started in fresh workspace", "replay_completed": "Replay equivalence result", "replay_failed": "Replay failed", "session_completed": "Session completed"}[e.event]||e.event))}<br><small class="muted">${safe(e.phase||'')} · rev ${safe(e.resulting_revision??e.revision??e.base_revision??'—')}</small></button>`).join('');document.querySelectorAll('.event').forEach(b=>b.onclick=()=>{pos=Number(b.dataset.i);render()});$('prev').onclick=()=>{pos=Math.max(0,pos-1);render()};$('next').onclick=()=>{pos=Math.min(E.length-1,pos+1);render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});render()} init();
</script></html>
